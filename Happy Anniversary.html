<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Anniversary 💍</title>
<meta name="description" content="A 3D ASCII platinum and sapphire engagement ring in a velvet red box.">
<meta name="theme-color" content="#000000">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:#000}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 10px;font-family:Georgia,serif}
canvas{display:block;max-width:100%;height:auto;background:#000}
#scene{touch-action:pan-y;cursor:grab}
.msg{margin:10px 0 0;color:#f4a3b8;font-style:italic;font-size:clamp(15px,2.4vw,20px);text-align:center}
.hint{margin:0;color:#555;font:12px monospace}
.sr{position:absolute;left:-9999px}
</style></head><body>
<h1 class="sr">Happy Anniversary</h1>
<canvas id="banner" role="img" aria-label="Happy Anniversary in ASCII art"></canvas>
<canvas id="scene" role="img" aria-label="A 3D ASCII engagement ring with a sapphire in a red velvet box"></canvas>
<p class="msg">Every year with you is my favorite chapter ♥</p>
<p class="hint">drag to rotate</p>
<script>
const $=id=>document.getElementById(id);
const COLS=innerWidth<620?66:96,ROWS=Math.round(COLS*.45),FS=13,dpr=Math.min(devicePixelRatio||1,2);
const RAMP=' .:-=+*#%@',FAM='"Arial Black",Impact,"Helvetica Neue",Arial,sans-serif';
function setup(c,w,h,fs){c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.font=fs+'px monospace';x.textBaseline='top';return x}
const tmp=document.createElement('canvas').getContext('2d');tmp.font=FS+'px monospace';
const CW=tmp.measureText('M').width,CH=FS*1.1,W=COLS*CW,H=ROWS*CH;
const sx=setup($('scene'),W,H,FS);

/* ---------- banner: "HAPPY ANNIVERSARY" turned into ASCII ---------- */
const BC=Math.round(COLS*1.6),BR=18,bcw=W/BC,bfs=bcw/.6,bch=bfs*1.1,OH=Math.round(BR*bch/bcw);
const bn=setup($('banner'),W,BR*bch,bfs);
const oc=Object.assign(document.createElement('canvas'),{width:BC,height:OH}).getContext('2d');
oc.font='900 100px '+FAM;const mw=oc.measureText('ANNIVERSARY').width;
const f=Math.min(OH/2.2,BC*.94/mw*100);
oc.font='900 '+f+'px '+FAM;oc.textAlign='center';oc.textBaseline='middle';oc.fillStyle='#fff';
oc.fillText('HAPPY',BC/2,OH*.26);oc.fillText('ANNIVERSARY',BC/2,OH*.74);
const img=oc.getImageData(0,0,BC,OH).data,cov=new Float32Array(BC*BR);
for(let j=0;j<BR;j++){const y0=Math.floor(j*OH/BR),y1=Math.max(y0+1,Math.floor((j+1)*OH/BR));
 for(let i=0;i<BC;i++){let s=0;for(let y=y0;y<y1;y++)s+=img[(y*BC+i)*4+3]/255;cov[j*BC+i]=Math.pow(s/(y1-y0),.7)}}
const ST=[[255,90,130],[255,210,100],[255,255,255],[70,150,255],[175,120,255],[255,90,130]];
function pal(p){p=((p%1)+1)%1*5;const k=p|0,q=p-k,a=ST[k],b=ST[k+1];
 return 'rgb('+(a[0]+(b[0]-a[0])*q|0)+','+(a[1]+(b[1]-a[1])*q|0)+','+(a[2]+(b[2]-a[2])*q|0)+')'}
const hash=(a,b)=>{const v=Math.sin(a*12.9898+b*78.233)*43758.5453;return v-Math.floor(v)};
function drawBanner(t){
 bn.fillStyle='#000';bn.fillRect(0,0,BC*bcw,BR*bch);
 for(let j=0;j<BR;j++)for(let i=0;i<BC;i++){const c=cov[j*BC+i];if(c<.12)continue;
  bn.fillStyle=hash(i+j*7,Math.floor(t*5))>.985?'#fff':pal(i/BC+t*.08);
  bn.fillText(RAMP[Math.min(9,c*9.99|0)],i*bcw,j*bch)}}

/* ---------- 3D scene (ray-marched signed distance fields) ---------- */
const abs=Math.abs,max=Math.max,min=Math.min,sqrt=Math.sqrt,sin=Math.sin,cos=Math.cos,PI=Math.PI;
const ASPECT=W/H;
function rb(x,y,z,a,b,c,r){const qx=abs(x)-a+r,qy=abs(y)-b+r,qz=abs(z)-c+r;
 return sqrt(max(qx,0)**2+max(qy,0)**2+max(qz,0)**2)+min(max(qx,qy,qz),0)-r}
const bx=(x,y,z,a,b,c)=>rb(x,y,z,a,b,c,0);
const LA=100*PI/180,LC=cos(LA),LS=sin(LA);let mat=0;
function map(x,y,z){
 /* 0 red velvet box, 1 cushion/lining, 2 platinum, 3 sapphire, 4 gold trim, 5 pave diamonds */
 let d=max(rb(x,y+.9,z,1.5,.45,1.1,.08),-bx(x,y+.45,z,1.3,.25,.9));mat=0;
 if(d<.02&&y>-.52&&y<-.4)mat=4;
 let t=rb(x,y+.55,z,1.28,.18,.88,.1);if(t<d){d=t;mat=1}
 const dy=y+.45,dz=z+1.1,ly=dy*LC-dz*LS,lz=dy*LS+dz*LC;
 t=max(rb(x,ly-.2,lz-1.1,1.5,.2,1.1,.06),-bx(x,ly+.1,lz-1.1,1.3,.25,.9));
 if(t<d){d=t;mat=ly<.05?4:ly<.17?1:0}
 /* ring */
 const bs=sqrt(x*x+(y-.35)**2+z*z)-1.05;
 if(bs>.15){if(bs<d){d=bs;mat=2}}else{
  const ry=y-.05,rr=sqrt(x*x+ry*ry),th=Math.atan2(x,ry),top=max(0,cos(th));
  const qx=abs(rr-.55)-.04+.03,qz=abs(z)-(.065+.035*top)+.03;
  t=sqrt(max(qx,0)**2+max(qz,0)**2)+min(max(qx,qz),0)-.03;       // tapered, cathedral band
  if(t<d){d=t;mat=2}
  const k=Math.max(-5,Math.min(5,Math.round(th/.2))),an=k*.2;      // pave stones every 11.5 deg
  t=sqrt((x-sin(an)*.585)**2+(ry-cos(an)*.585)**2+z*z)-.03;
  if(t<d){d=t;mat=5}
  t=sqrt(x*x+(y-.69)**2*1.5+z*z)-.1;if(t<d){d=t;mat=2}            // basket
  t=sqrt((abs(x)-.15)**2+((y-.8)*.45)**2+(abs(z)-.15)**2)-.035;   // 4 prongs
  if(t<d){d=t;mat=2}
  const gy=y-.86,u=max(max(abs(x),abs(z)),(abs(x)+abs(z))*.7071);  // octagonal sapphire, table + pavilion
  t=max((u+(gy>0?gy*1.6:-gy*1.15)-.27)*.6,gy-.1);
  if(t<d){d=t;mat=3}}
 return d}
const COL=[[190,22,48],[225,38,70],[238,242,252],[40,95,255],[255,208,92],[215,235,255]];
let ang=.5,drag=false,lx=0,auto=true;
const sc=$('scene');
sc.addEventListener('pointerdown',e=>{drag=true;auto=false;lx=e.clientX;sc.style.cursor='grabbing'});
addEventListener('pointerup',()=>{drag=false;sc.style.cursor='grab'});
addEventListener('pointermove',e=>{if(drag){ang-=(e.clientX-lx)*.01;lx=e.clientX}});
const L=(()=>{const a=[-.5,.9,.6],n=sqrt(.25+.81+.36);return a.map(v=>v/n)})();
const mask=new Uint8Array(COLS*ROWS);
const PC=['#ff6b9d','#ffd166','#4cc9f0','#b388ff','#ff8fab'],PCH=['♥','*','+','.','·','✦'];
const parts=Array.from({length:42},()=>({x:Math.random()*COLS,y:Math.random()*ROWS,v:.4+Math.random()*.9,p:Math.random()*6,c:PC[Math.random()*5|0],h:PCH[Math.random()*6|0]}));
function frame(T){
 const t=T/1000;if(auto)ang=sin(t*.5)*.8;
 const R=6.8,ox=sin(ang)*R,oz=cos(ang)*R,oy=2.4;
 let fx=-ox,fy=-.05-oy,fz=-oz;const fl=sqrt(fx*fx+fy*fy+fz*fz);fx/=fl;fy/=fl;fz/=fl;
 let rx=fz,rz=-fx;const rl=sqrt(rx*rx+rz*rz);rx/=rl;rz/=rl;
 const ux=fy*rz,uy=fz*rx-fx*rz,uz=-fy*rx;
 sx.fillStyle='#000';sx.fillRect(0,0,W,H);mask.fill(0);
 for(let j=0;j<ROWS;j++){const v=1-(j+.5)/ROWS*2;
  for(let i=0;i<COLS;i++){
   const u=((i+.5)/COLS*2-1)*ASPECT;
   let dx=fx*2.5+rx*u+ux*v,dy=fy*2.5+uy*v,dz=fz*2.5+rz*u+uz*v;
   const dl=sqrt(dx*dx+dy*dy+dz*dz);dx/=dl;dy/=dl;dz/=dl;
   let s=0,hit=false,px,py,pz;
   for(let k=0;k<70;k++){px=ox+dx*s;py=oy+dy*s;pz=oz+dz*s;const d=map(px,py,pz);if(d<.004){hit=true;break}s+=d;if(s>14)break}
   if(!hit)continue;
   const m=mat,e=.01;
   const nx=map(px+e,py,pz)-map(px-e,py,pz),ny=map(px,py+e,pz)-map(px,py-e,pz),nz=map(px,py,pz+e)-map(px,py,pz-e);
   const nl=sqrt(nx*nx+ny*ny+nz*nz)||1,Nx=nx/nl,Ny=ny/nl,Nz=nz/nl;
   let df=Nx*L[0]+Ny*L[1]+Nz*L[2];const dn=Nx*dx+Ny*dy+Nz*dz;
   const rx2=dx-2*dn*Nx,ry2=dy-2*dn*Ny,rz2=dz-2*dn*Nz,sp=max(0,rx2*L[0]+ry2*L[1]+rz2*L[2]);
   const rim=Math.pow(1-max(0,-dn),3);
   let b,c=COL[m],r=c[0],g=c[1],bl=c[2];
   if(m<2){df=max(0,(df+.6)/1.6);b=.12+df*.6+rim*.35+(hash(i,j)-.5)*.14;                 // velvet: soft wrap light, rim sheen, grain
    if(rim>.5){r+=40;g+=10}}
   else if(m===3||m===5){const fc=abs(sin(Nx*8+Ny*9+Nz*7+t*2.2));b=.4+.6*fc+Math.pow(sp,12)*.5; // faceted sparkle
    if(m===3){r=20+150*fc;g=50+165*fc;bl=210+45*fc}else{r=200+55*fc;g=225+30*fc}}
   else{b=m===4?.25+max(0,df)*.5+Math.pow(sp,12)*.6:.18+max(0,df)*.45+Math.pow(sp,20)*.9+rim*.15;
    if(m===2){const q=.5*b;r+=60*q*(.5+.5*sin(rx2*3+ry2*2));g+=60*q*(.5+.5*sin(ry2*3+2));bl+=60*q*(.5+.5*sin(rz2*3+4))}} // colored reflections
   b=min(1,max(0,b));const fm=.3+.7*b;
   sx.fillStyle='rgb('+min(255,r*fm|0)+','+min(255,g*fm|0)+','+min(255,bl*fm|0)+')';
   sx.fillText(RAMP[min(9,1+(b*8.99|0))],i*CW,j*CH);mask[j*COLS+i]=1}}
 sx.font=FS+'px monospace';
 for(const p of parts){p.y-=p.v*.04;if(p.y<0){p.y=ROWS;p.x=Math.random()*COLS}
  const i=p.x|0,j=p.y|0;if(mask[j*COLS+i])continue;
  sx.globalAlpha=.35+.65*abs(sin(t*1.5+p.p));sx.fillStyle=p.c;sx.fillText(p.h,i*CW,j*CH)}
 sx.globalAlpha=1;drawBanner(t);
 if(!still)requestAnimationFrame(frame)}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
requestAnimationFrame(frame);
</script></body></html>
